content: >-
  <h2>Ringkasan</h2>

  <p>Halaman <code>https://vba.skilling.us/lesson/exercises-0</code>
  ("Exercises") dikloning ke <code>vba.pesanweb.my.id</code>. Halaman sumbernya
  bukan pelajaran biasa: isinya hanya satu gambar, satu kalimat, lalu delapan
  rujukan latihan.</p>

  <ul>

  <li>Node: <strong>nid 391</strong> — tipe <code>lesson</code>, published, body
  881 karakter</li>

  <li>Judul: <strong>Latihan-latihan</strong></li>

  <li>Alias: <code>/lesson/exercises-0</code> (manual) dan
  <code>/lesson/latihan-latihan</code> (pathauto) — keduanya 200</li>

  <li>Book: bid 330, pid 343 ("Simple Programs"), weight -5, depth 3; pager prev
  "Contoh pengerjaan lain"</li>

  </ul>


  <h2>Delapan exercise node yang harus dibuat lebih dulu</h2>

  <table class="table">

  <tbody><tr><th>internal_name</th><th>nid</th><th>Judul</th><th>Gambar</th></tr>

  <tr><td><code>exercise_your_simple_program</code></td><td>383</td><td>Program
  sederhana Anda</td><td>0</td></tr>

  <tr><td><code>questions1</code></td><td>384</td><td>Pertanyaan</td><td>9</td></tr>

  <tr><td><code>exercise_cylinder_covering</code></td><td>385</td><td>Selubung
  tabung</td><td>6</td></tr>

  <tr><td><code>exercise_xp</code></td><td>386</td><td>XP</td><td>2 +
  tabel</td></tr>

  <tr><td><code>exercise_food_order</code></td><td>387</td><td>Pesanan
  makanan</td><td>2</td></tr>

  <tr><td><code>exercise_goatercise</code></td><td>388</td><td>Senam
  kambing</td><td>3 + 2 tabel</td></tr>

  <tr><td><code>exercise_bonnie_burns_effect</code></td><td>389</td><td>Efek
  Bonnie Burns</td><td>2</td></tr>

  <tr><td><code>exercise_mars_shot</code></td><td>390</td><td>Peluncuran ke
  Mars</td><td>2</td></tr>

  </tbody></table>

  <p>Semua <code>field_challenge=0</code>, body format <code>skilling</code>,
  published. Alias pathauto mengikuti judul Indonesia
  (<code>/exercise/selubung-tabung</code>, dst).</p>


  <h2>Verifikasi halaman hasil</h2>

  <ul>

  <li><code>/lesson/exercises-0</code> 200, <code>/lesson/latihan-latihan</code>
  200, <code>/node/391</code> 200</li>

  <li>8 blok <code>exercise.</code> dirender dengan judul Indonesia; 3 tabel; 28
  gambar (26 eksternal semuanya 200, sisanya aset lokal)</li>

  <li>Parser error 0; tidak ada markup mentah (<code>internal_name</code>)
  bocor; tidak ada URL gambar relatif</li>

  <li>Sisa teks Inggris hanya string sistem widget: "If you were logged in as a
  student, you could submit a solution to this exercise."</li>

  </ul>


  <h2>Temuan teknis</h2>

  <ul>

  <li><strong>Alias lesson lain ikut terhapus setiap kali lesson baru
  dibuat.</strong> Setelah menclone <code>exercises-0</code>, alias manual
  <code>/lesson/easy-good</code> (373), <code>/lesson/more-debugging</code>
  (381), dan <code>/lesson/another-worked-example</code> (382) semuanya 404,
  sementara alias pathauto-nya tetap 200. Diperbaiki dengan satu sapuan akhir:
  pasang ulang alias manual untuk <em>semua</em> node hasil clone, hapus baris
  duplikat pathauto, lalu <code>cache:rebuild</code>. Sekarang 10 URL
  lesson/alias diperiksa dan semuanya 200.</li>

  <li><strong>Halaman daftar latihan = 8 node dependensi + body 881
  karakter.</strong> Terjemahan dikerjakan per blok paragraf (kunci = teks asli,
  nilai = HTML Indonesia dengan <code>&lt;code&gt;</code>/<code>&lt;a&gt;</code>
  dipertahankan), tabel diterjemahkan eksplisit, gambar lewat pemetaan
  alt/title. Kunci yang tidak ketemu akan melempar error, jadi tidak ada
  paragraf yang hilang diam-diam.</li>

  <li><strong>Tautan internal dipetakan ke alias target</strong>
  (<code>/lesson/generalize</code> → <code>/lesson/generalisasi</code>,
  <code>/lesson/secluded-cells</code> →
  <code>/lesson/cells-yang-terpisah</code>); tautan unduhan <code>.xlsm</code>
  dibuat absolut ke host sumber.</li>

  <li><strong>Materi "Another worked example" (nid 382) sudah selesai</strong>
  dari sesi sebelumnya dan ikut diverifikasi: 4 gambar 200, 1 tabel, 1 iframe
  YouTube, 0 parser error, pager prev/next benar.</li>

  </ul>
