  (<code>sites.php</code> default, tanpa alias custom).</p>


  <h2>4. Langkah akses DB (dari mesin lokal)</h2>

  <ol>

  <li><strong>SSH hop</strong> (key sudah terpasang, passwordless): <code>ssh
  home.pesanweb.my.id</code> lalu <code>ssh root@192.168.2.57</code>. Dari luar
  LAN, ini satu-satunya path aman — port 3306/8083 tidak boleh dibuka ke
  internet</li>

  <li><strong>CLI mysql/mariadb</strong> lewat docker exec:

  <ul>

  <li>home: <code>docker exec -it drupal_database mariadb -uroot -p&lt;pass&gt;
  -e "SHOW DATABASES;"</code></li>

  <li>2.57: <code>docker exec -it drupal-nfs_drupal_db.1.&lt;id&gt; mariadb
  -uroot -p&lt;pass&gt; -e "SHOW DATABASES;"</code></li>

  </ul></li>

  <li><strong>Lewat Drupal (drush)</strong>: home <code>docker exec d8_fpm
  vendor/bin/drush -r web -l &lt;domain&gt; sqlq "SHOW TABLES;"</code>. Di 2.57
  container fpm7 <strong>tidak punya mysql client</strong> → <code>drush
  sqlq</code> gagar; gunakan db container langsung (atau <code>drush
  sql:connect</code> untuk lihat DSN-nya)</li>

  <li><strong>GUI phpMyAdmin</strong>: SAAT INI OFFLINE kedua mesin (Fase 1).
  Butuh sementara? <code>docker start drupal_pma</code> (home) lalu segera stop
  lagi — lebih baik pakai ssh tunnel + container PMA sementara dengan password
  kuat</li>

  <li><strong>Baca kredensial situs</strong>: <code>grep -A10
  "databases\['default'\]\['default'\]"
  sites/&lt;domain&gt;/settings.php</code></li>

  </ol>


  <h2>5. Kenapa ganti password bisa/bukan memutus Drupal</h2>

  <ul>

  <li>Drupal baca <code>settings.php</code> tiap request — tidak ada cache
  kredensial. <code>ALTER USER</code> duluan = gap error 500 sampai settings
  diperbarui</li>

  <li><strong>Metode bebas putus</strong>: CREATE USER baru + grant → swap
  settings.php (atomic <code>mv</code>) → verifikasi HTTP 200 → DROP user lama.
  Situs tidak pernah putus</li>

  <li><strong>Root tidak dipakai Drupal</strong> (dipakai backup container +
  PMA) — rotate root tidak memutus situs, tapi memutus cron backup &amp; PMA
  sampai container di-recreate. Karena compose file hilang, rekonstruksi dulu
  (Fase 0 di halaman runbook)</li>

  <li>Jangan lupa: home punya 2 settings aktif (web, belajarweb), 2.57 punya 1
  (belajarweb) — update SEMUA yang mereferensikan user yang diubah</li>

  </ul>


  <h2>6. Temuan kritis lain (untuk runbook)</h2>

  <ul>

  <li>Compose file <code>/data/compose/34/docker-compose.yml</code>
  <strong>hilang</strong> di home (container jalan, label menyebut file itu) —
  rekonstruksi dari <code>docker inspect</code> atau Portainer sebelum recreate
  container</li>

  <li>Home: <code>drupal11-src/web/sites/default/settings.php</code> berupa
  <strong>direktori</strong> (deploy rusak) → vhost D11 404</li>

  <li>2.57: <code>drupal11-src/.../settings.php</code> = <strong>file 0
  byte</strong>; <code>drupal8-src/.../default/settings.php</code> = salinan
  default (placeholder) → D11 &amp; default D8 tidak terkonfigurasi</li>

  <li>Hash password <code>belajarweb</code> sama di kedua mesin → satu password
  dipakai dua mesin, harus di-break jadi password berbeda per mesin saat
  rotasi</li>

  </ul>


