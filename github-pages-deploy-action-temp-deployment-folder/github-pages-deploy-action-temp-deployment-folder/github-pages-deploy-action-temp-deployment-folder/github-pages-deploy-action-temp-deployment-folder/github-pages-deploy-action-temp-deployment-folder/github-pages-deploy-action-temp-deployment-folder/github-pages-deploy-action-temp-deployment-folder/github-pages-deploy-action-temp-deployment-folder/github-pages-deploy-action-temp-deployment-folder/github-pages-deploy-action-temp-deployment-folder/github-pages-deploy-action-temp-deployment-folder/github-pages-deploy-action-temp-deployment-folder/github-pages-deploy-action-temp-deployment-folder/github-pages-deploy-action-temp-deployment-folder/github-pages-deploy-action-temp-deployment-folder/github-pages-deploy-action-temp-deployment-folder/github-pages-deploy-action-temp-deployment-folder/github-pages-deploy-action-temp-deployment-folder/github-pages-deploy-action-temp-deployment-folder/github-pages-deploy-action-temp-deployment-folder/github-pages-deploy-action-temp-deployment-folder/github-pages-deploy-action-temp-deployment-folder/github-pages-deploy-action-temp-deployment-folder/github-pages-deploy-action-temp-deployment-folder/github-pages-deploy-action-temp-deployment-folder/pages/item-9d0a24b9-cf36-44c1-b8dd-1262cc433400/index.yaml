  <h2>Status Fase 1 hardening (SUDAH DILAKUKAN, 2025-10-26)</h2>

  <ul>

  <li>Home: container <code>drupal_pma</code> <strong>STOPPED</strong> (Exited)
  — phpMyAdmin :8083 offline, situs tetap live (D8 port 8087 = HTTP 200)</li>

  <li>192.168.2.57: service <code>drupal-nfs_phpmyadmin</code> di-scale ke
  <strong>0 replica</strong> (1/0) — :8083 offline</li>

  <li>Belum ada password yang diubah — ini baru menutup pintu masuk. Fase 2-4
  (rotasi password) menunggu keputusan</li>

  </ul>


  <h2>1. Kondisi password DB (state, tanpa nilai asli)</h2>

